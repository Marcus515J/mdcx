name: Prepare draft release candidate

on:
  push:
    branches:
      - 'release/**'
    paths:
      - 'mdcx/**'
      - 'tests/**'
      - 'resources/**'
      - 'scripts/**'
      - 'changelog.md'
      - '.github/workflows/release-candidate.yml'

permissions:
  contents: write

jobs:
  draft:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.draft.outputs.tag }}
      matrix: ${{ steps.draft.outputs.matrix }}
      build_required: ${{ steps.draft.outputs.build_required }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prepare unpublished release for the exact candidate commit
        id: draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import re
          import subprocess
          import urllib.request

          tag = re.search(r"LOCAL_VERSION\s*=\s*(\d+)", Path("mdcx/consts.py").read_text()).group(1)
          repo = os.environ["GITHUB_REPOSITORY"]
          sha = os.environ["GITHUB_SHA"]
          def api(path, method="GET", data=None):
              req = urllib.request.Request(
                  "https://api.github.com/repos/" + repo + "/" + path,
                  data=json.dumps(data).encode() if data is not None else None,
                  headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"],
                           "Accept": "application/vnd.github+json",
                           "Content-Type": "application/json"},
                  method=method)
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.load(response)
          existing = next((r for r in api("releases?per_page=100") if r["tag_name"] == tag), None)
          if existing:
              assert existing["draft"], "Never modify a published release"
          # Pipeline/docs-only changes can reuse already verified draft assets.
          unchanged = existing and subprocess.run(
              ["git", "diff", "--quiet", existing["target_commitish"], sha, "--",
               "main.py", "mdcx", "resources", "libs", "scripts", "pyproject.toml", "uv.lock"],
              check=False).returncode == 0
          matrix = []
          for runner, platform, extension in (("windows-latest", "windows-x86_64", "exe"),
                                               ("macos-latest", "macos-aarch64", "dmg")):
              name = "MDCx-" + tag + "-" + platform + "." + extension
              asset = next((a for a in existing["assets"] if a["name"] == name), None) if existing else None
              if unchanged and asset and asset["state"] == "uploaded" and asset.get("digest"):
                  print("Reusing verified asset with identical application source:", name, asset["digest"])
              else:
                  matrix.append({"os": runner, "platform": platform})
          payload = {"tag_name": tag, "target_commitish": sha,
                     "name": "MDCx " + tag, "draft": True, "prerelease": False,
                     "body": Path("changelog.md").read_text(encoding="utf-8")}
          release = api("releases/" + str(existing["id"]), "PATCH", payload) if existing else api("releases", "POST", payload)
          assert release["draft"] and release["target_commitish"] == sha
          with open(os.environ["GITHUB_OUTPUT"], "a") as stream:
              stream.write("tag=" + tag + "\n")
              stream.write("matrix=" + json.dumps({"include": matrix}) + "\n")
              stream.write("build_required=" + ("true" if matrix else "false") + "\n")
          print("Prepared draft", tag, "at", sha, "without publishing")
          PY

  build:
    needs: draft
    if: needs.draft.outputs.build_required == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.draft.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHONIOENCODING: utf-8
      QT_QPA_PLATFORM: offscreen
      RELEASE_TAG: ${{ needs.draft.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'
          activate-environment: true
      - name: Install locked dependencies
        run: uv sync --locked --dev
      - name: Validate Windows settings, process management and configuration
        if: runner.os == 'Windows'
        run: uv run --locked pytest -q tests/test_llm_settings_ui.py tests/test_garbage_settings_ui.py tests/test_local_model.py tests/test_config_conversion.py tests/test_config_network.py
      - name: Validate macOS settings, configuration and translation interfaces
        if: runner.os == 'macOS'
        run: uv run --locked pytest -q tests/test_llm_settings_ui.py tests/test_garbage_settings_ui.py tests/test_config_conversion.py tests/test_config_network.py tests/test_local_llm.py
      - name: Build Windows candidate
        if: runner.os == 'Windows'
        run: uv run --locked scripts/build.py --debug
      - name: Build macOS candidate
        if: runner.os == 'macOS'
        run: uv run --locked scripts/build.py --create-dmg --debug
      - name: Verify bundled source version, modules and defaults
        shell: bash
        run: |
          uv run --locked python - <<'PY'
          import json
          import os
          from pathlib import Path
          from PyInstaller.archive.readers import CArchiveReader

          executable = Path("dist/MDCx.exe") if os.name == "nt" else Path("dist/MDCx.app/Contents/MacOS/MDCx")
          archive = CArchiveReader(str(executable))
          pyz = archive.open_embedded_archive("PYZ.pyz")
          for name in ("mdcx.local_model", "mdcx.controllers.main_window.local_model_settings", "mdcx.controllers.main_window.settings_layout"):
              assert name in pyz.toc, name
          constants = pyz.extract("mdcx.consts").co_consts
          assert int(os.environ["RELEASE_TAG"]) in constants
          assert "Marcus515J/mdcx" in constants
          if os.name == "nt":
              entry = next(name for name in archive.toc if name.replace("\\", "/").endswith("resources/config/default_config.json"))
              bundled = json.loads(archive.extract(entry))
          else:
              bundled = json.loads(Path("dist/MDCx.app/Contents/Resources/resources/config/default_config.json").read_text(encoding="utf-8"))
          assert bundled == json.loads(Path("resources/config/default_config.json").read_text(encoding="utf-8"))
          print("Verified bundled version, repository, model manager and default configuration")
          PY
      - name: Upload candidate assets to draft only
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PLATFORM: ${{ matrix.platform }}
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            candidate_extension=exe
          else
            candidate_extension=dmg
          fi
          candidate_asset="MDCx-${RELEASE_TAG}-${RELEASE_PLATFORM}.${candidate_extension}"
          cp "dist/MDCx.${candidate_extension}" "dist/${candidate_asset}"
          test "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = true
          gh release upload "$RELEASE_TAG" "dist/${candidate_asset}" --repo "$GITHUB_REPOSITORY" --clobber
          uv run --locked python -c 'import hashlib,sys; from pathlib import Path; p=Path(sys.argv[1]); print(p.name, hashlib.file_digest(p.open("rb"), "sha256").hexdigest())' "dist/${candidate_asset}"
