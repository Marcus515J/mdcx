name: Windows local model launcher

on:
  push:
    branches:
      - 'feat/local-hy-mt2-translation'
    tags:
      - 'launcher-*'
    paths:
      - 'scripts/*hymt2*'
      - 'scripts/Start-HyMT2.cmd'
      - '.github/workflows/local-launcher.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  launcher:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Test discovery, startup, errors and double-click entry on Windows PowerShell 5.1
        shell: powershell
        run: python scripts/test_local_hymt2_launcher.py
      - name: Package double-click launcher
        shell: powershell
        run: ./scripts/package-local-hymt2.ps1
      - name: Save validated package
        uses: actions/upload-artifact@v4
        with:
          name: MDCx-HyMT2-launcher
          path: dist/MDCx-HyMT2-launcher.zip
      - name: Publish launcher prerelease
        if: startsWith(github.ref, 'refs/tags/launcher-')
        uses: svenstaro/upload-release-action@v2
        with:
          tag: ${{ github.ref_name }}
          file: dist/MDCx-HyMT2-launcher.zip
          asset_name: MDCx-HyMT2-launcher.zip
          prerelease: true
          overwrite: false
          body: |
            本机 Hy-MT2 启动器：下载 ZIP，整个解压后双击 Start-HyMT2.cmd。
            只需输入大概安装在哪个盘（例如 H），自动查找海南鸡安装记录、服务程序和模型。
            等待“服务已就绪”，保持窗口打开，再在 MDCx 选择本机 Hy-MT2 预设并保存。
            失败时保留错误窗口和日志。复用已有安装，不下载模型，不读取私人 API Key/Cookie。
            可配合 test-20261009-local-hymt2 的 MDCx EXE 使用。
            Windows PowerShell 5.1 已运行自动查找、含中文/空格路径、服务就绪、失败、超时和 CMD 入口的模拟测试；真实 GPU 加载仍需在你的电脑验证。
