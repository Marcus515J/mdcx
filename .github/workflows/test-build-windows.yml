# 临时：测试构建，合并前删除
name: Test Build (Windows, temporary)

on:
  push:
    branches:
      - ci/test-build-windows
  workflow_dispatch:

permissions:
  contents: read

env:
  BUILD_VERSION: v1.1.1
  QT_QPA_PLATFORM: offscreen
  PYTHONIOENCODING: utf-8

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 50f3ec3f5ed6c7d4a14552e5a59e3e43a8ea792e
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'
          activate-environment: true
      - name: Install locked dependencies
        run: uv sync --locked --dev
      - name: Validate javlibrary and release versions on Windows
        shell: bash
        run: |
          uv run --locked pytest -q tests/crawlers/test_javlibrary.py tests/crawlers/test_javlibrary_list_match.py tests/crawlers/test_javlibrary_429_backoff.py tests/crawlers/test_anti_ban_step1.py tests/crawlers/test_anti_ban_step2.py tests/crawlers/test_anti_ban_step3.py tests/crawlers/test_anti_ban_round2_supplement.py tests/test_crawl_circuit.py tests/test_version.py
          uv run --locked python scripts/check_release_version.py "$BUILD_VERSION"
      - name: Build Windows application
        shell: bash
        run: |
          uv run --locked python scripts/build.py --version "$BUILD_VERSION" --debug
          uv run --locked python scripts/check_release_version.py "$BUILD_VERSION" --bundle dist/MDCx.exe
      - name: Name test build
        shell: bash
        run: |
          mkdir -p test-assets
          cp dist/MDCx.exe "test-assets/MDCx-$BUILD_VERSION-TEST-50f3ec3-windows-x86_64.exe"
          cd test-assets
          sha256sum *.exe > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64-test-50f3ec3
          path: test-assets/*
          if-no-files-found: error
          retention-days: 14
