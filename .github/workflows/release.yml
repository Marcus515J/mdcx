name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: '正式版本标签，如 v1.1.0'
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
  QT_QPA_PLATFORM: offscreen
  PYTHONIOENCODING: utf-8

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x86_64
            extension: exe
          - os: macos-latest
            platform: macos-aarch64
            extension: dmg
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'
          activate-environment: true
      - name: Install locked dependencies
        run: uv sync --locked --dev
      - name: Validate release versions and affected behavior
        shell: bash
        run: |
          uv run --locked python scripts/check_release_version.py "$RELEASE_TAG"
          uv run --locked pytest -q tests/test_version.py tests/test_release_version.py tests/test_config_conversion.py
      - name: Build Windows application
        if: runner.os == 'Windows'
        shell: bash
        run: |
          uv run --locked python scripts/build.py --version "$RELEASE_TAG" --debug
          uv run --locked python scripts/check_release_version.py "$RELEASE_TAG" --bundle dist/MDCx.exe
      - name: Build macOS application
        if: runner.os == 'macOS'
        shell: bash
        run: |
          uv run --locked python scripts/build.py --version "$RELEASE_TAG" --create-dmg --debug
          uv run --locked python scripts/check_release_version.py "$RELEASE_TAG" --bundle dist/MDCx.app
      - name: Name installer with the release version
        shell: bash
        env:
          INSTALLER_PLATFORM: ${{ matrix.platform }}
          INSTALLER_EXTENSION: ${{ matrix.extension }}
        run: |
          mkdir -p release-assets
          cp "dist/MDCx.$INSTALLER_EXTENSION" "release-assets/MDCx-$RELEASE_TAG-$INSTALLER_PLATFORM.$INSTALLER_EXTENSION"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Check assets and generate checksums
        working-directory: release-assets
        run: |
          test -s "MDCx-$RELEASE_TAG-windows-x86_64.exe"
          test -s "MDCx-$RELEASE_TAG-macos-aarch64.dmg"
          sha256sum "MDCx-$RELEASE_TAG-windows-x86_64.exe" "MDCx-$RELEASE_TAG-macos-aarch64.dmg" > "MDCx-$RELEASE_TAG-SHA256SUMS.txt"
      - name: Create complete release as draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$RELEASE_TAG" release-assets/* --verify-tag --draft --title "MDCx $RELEASE_TAG" --notes-file changelog.md
      - name: Publish validated release and retire the date-numbered release
        uses: actions/github-script@v7
        with:
          script: |
            const finalize = require('./.github/scripts/finalize-release.cjs');
            await finalize({ github, context, tag: process.env.RELEASE_TAG });
