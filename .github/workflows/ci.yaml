name: CI/CD Pipeline

on:
  push:
    branches:
      - master
      - develop
  pull_request:
    branches:
      - master
      - develop
    types: [opened, synchronize, reopened, ready_for_review, review_requested]

jobs:
  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Run ruff format
        run: uvx ruff@0.15.12 format --check

      - name: Run ruff check
        run: uvx ruff@0.15.12 check --output-format=github

  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libegl1 libopengl0

      - name: Install locked dependencies
        run: uv sync --locked --dev

      - name: Run tests
        run: uv run --locked pytest -q
