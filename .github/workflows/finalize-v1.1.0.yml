name: Finalize validated v1.1.0 release

on:
  push:
    branches: [master]
    paths: ['.github/workflows/finalize-v1.1.0.yml']
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify original builds and publish their existing assets
        uses: actions/github-script@v7
        with:
          script: |
            const repo = { owner: context.repo.owner, repo: context.repo.repo };
            const ref = (await github.rest.git.getRef({ ...repo, ref: 'tags/v1.1.0' })).data.object;
            const source = ref.type === 'tag' ? (await github.rest.git.getTag({ ...repo, tag_sha: ref.sha })).data.object.sha : ref.sha;
            if (source !== 'b2836534a133cd9f3c44203449f40c7a1dbf4283') throw new Error('Unexpected release source');
            const jobs = (await github.rest.actions.listJobsForWorkflowRun({ ...repo, run_id: 38244146018 })).data.jobs;
            for (const platform of ['macos', 'windows']) {
              if (!jobs.some(job => job.name.startsWith('build (') && job.name.includes(platform) && job.conclusion === 'success')) {
                throw new Error(`Native ${platform} validation did not succeed`);
              }
            }
            const finalize = require('./.github/scripts/finalize-release.cjs');
            await finalize({ github, context, tag: 'v1.1.0', expectedAssets: {
              'MDCx-v1.1.0-windows-x86_64.exe': '5ebd9da2cd099bebec3e98dcfdb36d71a674fae9b44abe1a29469dac71793912',
              'MDCx-v1.1.0-macos-aarch64.dmg': '8fe14ac39ee1b1dc8e7b71be508939144ccd0623b7aad79a53eba9628695aa7b',
              'MDCx-v1.1.0-SHA256SUMS.txt': 'cb0524501e09133c10a92dbc9397922d45b6c314f1f0cb87b6d446902a6f6975'
            }});
